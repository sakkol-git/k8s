# The version of the Kubernetes API to use
apiVersion: v1
# What kind of resource we are creating (Secret stores confidential data like passwords)
kind: Secret
metadata:
  # The name of this Secret
  name: web-app-secret
# We use stringData instead of data so we don't have to base64 encode the values ourselves
stringData:
  # The actual sensitive data
  DB_PASSWORD: "my-super-secret-password"
